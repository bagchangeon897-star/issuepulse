        function renderAdminPage(allIssues) {
          const activeCount = allIssues.filter((i) => i.status === 'ongoing' || i.status === 'investigating').length;
          const globalCount = allIssues.filter((i) => i.scope === 'global').length;

          return `
            <div class="stack-lg">
              <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;align-items:flex-end;">
                <div>
                  <p class="eyebrow">에디터 백오피스</p>
                  <h1 class="h1-title">이슈 관리자 콘솔</h1>
                  <p class="sub-note">등록·수정 내용은 브라우저 저장소에 즉시 반영됩니다.</p>
                </div>
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                  <button type="button" class="btn btn-secondary" id="btn-reset-samples">초기화</button>
                  <button type="button" class="btn btn-primary" id="btn-toggle-admin-form">${state.showAdminForm ? '작성 닫기' : '새 이슈 등록'}</button>
                </div>
              </div>

              <div class="grid-3">
                <div class="card detail-box"><div class="sub-note">전체 이슈</div><div class="font-mono-num" style="font-size:26px;font-weight:800;margin-top:6px;">${allIssues.length}</div></div>
                <div class="card detail-box"><div class="sub-note">진행·조사 중</div><div class="font-mono-num txt-violet" style="font-size:26px;font-weight:800;margin-top:6px;">${activeCount}</div></div>
                <div class="card detail-box"><div class="sub-note">글로벌 브리핑</div><div class="font-mono-num txt-blue" style="font-size:26px;font-weight:800;margin-top:6px;">${globalCount}</div></div>
              </div>

              ${
                state.showAdminForm
                  ? `
                <form id="admin-create-form" class="card detail-box stack-md">
                  <h2 class="h2-title" style="font-size:17px;">새 이슈 등록</h2>
                  <input required id="adm-title" class="input" style="width:100%;" placeholder="이슈 제목 *" />
                  <input required id="adm-sub" class="input" style="width:100%;" placeholder="한 줄 부제 *" />
                  <div class="grid-2">
                    <select id="adm-cat" class="input">
                      ${Object.keys(CATEGORY_LABELS)
                        .map((c) => `<option value="${c}">${CATEGORY_LABELS[c]}</option>`)
                        .join('')}
                    </select>
                    <select id="adm-scope" class="input">
                      <option value="domestic">국내</option>
                      <option value="global">글로벌</option>
                    </select>
                  </div>
                  <input id="adm-s1" class="input" style="width:100%;" placeholder="30초 요약 1문장" />
                  <textarea id="adm-overview" rows="3" class="textarea" placeholder="배경 설명"></textarea>
                  <div style="display:flex;justify-content:space-between;gap:8px;">
                    <button type="button" class="btn btn-blue-soft" id="btn-adm-auto">제목으로 카테고리 자동 분류</button>
                    <button type="submit" class="btn btn-primary">저장하기</button>
                  </div>
                </form>`
                  : ''
              }

              <section class="card">
                <div style="padding:16px 20px;border-bottom:1px solid var(--border);font-weight:700;">이슈 목록 관리</div>
                <div>
                  ${allIssues
                    .slice(0, 20)
                    .map(
                      (i) => `
                    <div style="padding:14px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:center;">
                      <div style="min-width:0;flex:1;">
                        <div class="meta-line" style="font-size:11.5px;">
                          <span class="txt-violet">${esc(CATEGORY_LABELS[i.category])}</span>
                          <span>·</span>
                          <span class="font-mono-num">${esc(i.updatedAt)}</span>
                        </div>
                        <div style="font-weight:700;margin-top:2px;">${esc(i.title)}</div>
                      </div>
                      <div style="display:flex;gap:8px;align-items:center;">
                        <select class="input" style="height:36px;font-size:12px;" data-admin-status="${esc(i.id)}">
                          ${Object.keys(STATUS_LABELS)
                            .map((s) => `<option value="${s}" ${i.status === s ? 'selected' : ''}>${STATUS_LABELS[s]}</option>`)
                            .join('')}
                        </select>
                        <button type="button" class="btn btn-secondary" style="min-height:36px;" data-open-issue="${esc(i.id)}">보기</button>
                      </div>
                    </div>`
                    )
                    .join('')}
                </div>
              </section>
            </div>`;
        }

        // =========================================================
        // 9. Master Render & Event Binding
        // =========================================================
        function applyTheme() {
          const isDark = state.prefs.theme === 'dark';
          document.documentElement.classList.toggle('dark', isDark);
          const icon = document.getElementById('theme-icon');
          if (icon) icon.textContent = isDark ? '☀' : '☾';
        }

        function render() {
          applyTheme();
          const allIssues = getAllIssues();
          const main = document.getElementById('app-main');
          if (!main) return;

          if (state.route.name === 'home') main.innerHTML = renderHomePage(allIssues);
          else if (state.route.name === 'explore') main.innerHTML = renderExplorePage(allIssues);
          else if (state.route.name === 'detail') main.innerHTML = renderDetailPage(allIssues, state.route.issueId);
          else if (state.route.name === 'saved') main.innerHTML = renderSavedPage(allIssues);
          else if (state.route.name === 'mypage') main.innerHTML = renderMyPage();
          else main.innerHTML = renderAdminPage(allIssues);

          document.querySelectorAll('[data-nav]').forEach((btn) => {
            btn.classList.toggle('active', btn.getAttribute('data-nav') === state.route.name);
          });
          const savedLabel = document.getElementById('mobile-saved-label');
          if (savedLabel) savedLabel.textContent = `관심(${state.followedIds.length})`;

          bindPageEvents();
        }

        function bindPageEvents() {
          const main = document.getElementById('app-main');
          if (!main) return;

          main.querySelectorAll('[data-open-issue]').forEach((el) => {
            el.addEventListener('click', (e) => {
              if (e.target.closest('[data-quick-brief],[data-follow],[data-bookmark],[data-admin-status]')) return;
              openIssueDetail(el.getAttribute('data-open-issue'));
            });
          });

          main.querySelectorAll('[data-quick-brief]').forEach((el) => {
            el.addEventListener('click', (e) => {
              e.stopPropagation();
              openQuickModal(el.getAttribute('data-quick-brief'));
            });
          });

          main.querySelectorAll('[data-follow]').forEach((el) => {
            el.addEventListener('click', (e) => {
              e.stopPropagation();
              toggleFollow(el.getAttribute('data-follow'));
            });
          });

          main.querySelectorAll('[data-bookmark]').forEach((el) => {
            el.addEventListener('click', (e) => {
              e.stopPropagation();
              toggleBookmark(el.getAttribute('data-bookmark'));
            });
          });

          main.querySelectorAll('[data-cat-tab]').forEach((el) => {
            el.addEventListener('click', () => {
              state.selectedCategory = el.getAttribute('data-cat-tab');
              render();
            });
          });

          main.querySelectorAll('[data-sort]').forEach((el) => {
            el.addEventListener('click', () => {
              state.sortMode = el.getAttribute('data-sort');
              render();
            });
          });

          main.querySelector('#btn-refresh-live')?.addEventListener('click', () => checkAndSyncHourly(true));

          main.querySelectorAll('[data-nav]').forEach((el) => {
            el.addEventListener('click', () => navigate({ name: el.getAttribute('data-nav') }));
          });

          // Explore events
          main.querySelector('#explore-form')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const val = main.querySelector('#explore-input')?.value || '';
            state.exploreQuery = val;
            if (val.trim()) {
              state.recentSearches = [val.trim(), ...state.recentSearches.filter((t) => t !== val.trim())].slice(0, 8);
              safeStorage.set(STORAGE_KEYS.SEARCHES, state.recentSearches);
            }
            render();
          });

          main.querySelector('#btn-live-search')?.addEventListener('click', async () => {
            const val = (main.querySelector('#explore-input')?.value || state.exploreQuery).trim();
            if (!val) {
              showToast('검색할 키워드를 입력해 주세요.');
              return;
            }
            state.exploreQuery = val;
            state.searchingLive = true;
            render();
            try {
              const { issues } = await fetchLiveFeeds(val);
              if (issues.length > 0) {
                const seen = new Set(state.liveIssues.map((i) => i.id));
                const fresh = issues.filter((i) => !seen.has(i.id));
                state.liveIssues = [...fresh, ...state.liveIssues];
                safeStorage.set(STORAGE_KEYS.CACHED_LIVE, state.liveIssues);
                showToast(`‘${val}’ 실시간 기사 ${issues.length}건을 가져왔습니다.`);
              } else {
                showToast('실시간 RSS 검색 결과를 찾지 못했습니다.');
              }
            } finally {
              state.searchingLive = false;
              render();
            }
          });

          main.querySelectorAll('[data-quick-search]').forEach((el) => {
            el.addEventListener('click', () => {
              state.exploreQuery = el.getAttribute('data-quick-search');
              render();
            });
          });

          main.querySelectorAll('[data-ex-cat]').forEach((el) => {
            el.addEventListener('click', () => {
              state.exploreCategory = el.getAttribute('data-ex-cat');
              render();
            });
          });

          // Detail events
          main.querySelector('#btn-back')?.addEventListener('click', () => navigate(state.previousRoute || { name: 'home' }));

          main.querySelector('#qa-form')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const input = main.querySelector('#qa-input');
            const q = input?.value.trim();
            if (!q || state.route.name !== 'detail') return;
            const issue = getAllIssues().find((i) => i.id === state.route.issueId);
            if (!issue) return;
            const prev = state.qaMessagesByIssue[issue.id] || [
              { role: 'bot', text: `‘${issue.title}’ 브리핑에 대해 궁금한 점을 물어보세요.` },
            ];
            state.qaMessagesByIssue[issue.id] = [
              ...prev,
              { role: 'user', text: q },
              { role: 'bot', text: answerQuestionLocally(issue, q) },
            ];
            render();
          });

          main.querySelectorAll('[data-qa-quick]').forEach((el) => {
            el.addEventListener('click', () => {
              const q = el.getAttribute('data-qa-quick');
              const input = main.querySelector('#qa-input');
              if (input) input.value = q;
              main.querySelector('#qa-form')?.dispatchEvent(new Event('submit', { cancelable: true }));
            });
          });

          // Saved & MyPage events
          main.querySelectorAll('[data-saved-tab]').forEach((el) => {
            el.addEventListener('click', () => {
              state.savedTab = el.getAttribute('data-saved-tab');
              render();
            });
          });

          main.querySelectorAll('[data-set-theme]').forEach((el) => {
            el.addEventListener('click', () => {
              state.prefs.theme = el.getAttribute('data-set-theme');
              safeStorage.set(STORAGE_KEYS.PREFS, state.prefs);
              render();
            });
          });

          main.querySelectorAll('[data-pref-cat]').forEach((el) => {
            el.addEventListener('click', () => {
              const cat = el.getAttribute('data-pref-cat');
              const exists = state.prefs.preferredCategories.includes(cat);
              state.prefs.preferredCategories = exists
                ? state.prefs.preferredCategories.filter((c) => c !== cat)
                : [...state.prefs.preferredCategories, cat];
              safeStorage.set(STORAGE_KEYS.PREFS, state.prefs);
              render();
            });
          });

          main.querySelectorAll('[data-export]').forEach((el) => {
            el.addEventListener('click', () => exportBriefings(el.getAttribute('data-export')));
          });

          main.querySelector('#btn-copy-html')?.addEventListener('click', copyFullHtmlCode);
          main.querySelectorAll('[data-dl-html]').forEach((el) => {
            el.addEventListener('click', handleDownloadHtmlClick);
          });

          // Admin events
          main.querySelector('#btn-toggle-admin-form')?.addEventListener('click', () => {
            state.showAdminForm = !state.showAdminForm;
            render();
          });

          main.querySelector('#btn-reset-samples')?.addEventListener('click', () => {
            state.customIssues = RAW_SAMPLE_ISSUES;
            safeStorage.set(STORAGE_KEYS.CUSTOM_ISSUES, RAW_SAMPLE_ISSUES);
            showToast('기본 이슈 데이터로 초기화했습니다.');
            render();
          });

          main.querySelector('#btn-adm-auto')?.addEventListener('click', () => {
            const t = main.querySelector('#adm-title')?.value || '';
            const s = main.querySelector('#adm-sub')?.value || '';
            const res = classifyIssueCategory(`${t} ${s}`, 'controversy');
            const sel = main.querySelector('#adm-cat');
            if (sel) sel.value = res.primaryCategory;
            showToast(`자동 분류 결과: ${CATEGORY_LABELS[res.primaryCategory]}`);
          });

          main.querySelector('#admin-create-form')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const title = main.querySelector('#adm-title')?.value.trim();
            const subtitle = main.querySelector('#adm-sub')?.value.trim();
            const category = main.querySelector('#adm-cat')?.value || 'controversy';
            const scope = main.querySelector('#adm-scope')?.value || 'domestic';
            const s1 = main.querySelector('#adm-s1')?.value.trim();
            const overview = main.querySelector('#adm-overview')?.value.trim();
            if (!title || !subtitle) return;

            const newItem = {
              id: `custom-${Date.now()}`,
              title,
              subtitle,
              category,
              scope,
              regionLabel: scope === 'global' ? '글로벌' : `국내 · ${CATEGORY_LABELS[category]}`,
              status: 'ongoing',
              isNewDiscovery: true,
              isBreaking: true,
              heatIndex: 88,
              publishedTimestamp: Date.now(),
              tags: ['신규등록', CATEGORY_LABELS[category]],
              summary30s: [
                s1 || subtitle,
                '관리자 콘솔에서 직접 등록된 이슈 브리핑입니다.',
                '후속 경위가 확인되면 타임라인에 추가됩니다.',
              ],
              background: { overview: overview || subtitle, keyTerms: [] },
              timeline: [{ id: `tl-${Date.now()}`, dateLabel: '방금', stage: '초기 등록', title: '이슈 브리핑 등록', description: subtitle }],
              verifiedFacts: [],
              unverifiedClaims: [],
              officialStatements: [],
              sources: [{ id: `src-${Date.now()}`, title, publisher: '관리자 등록', url: '#custom', publishedAt: '방금', isSamplePlaceholder: true }],
              isSampleData: true,
              dataOrigin: 'dev_sample',
            };
            state.customIssues = [newItem, ...state.customIssues];
            safeStorage.set(STORAGE_KEYS.CUSTOM_ISSUES, state.customIssues);
            state.showAdminForm = false;
            showToast('새 이슈가 등록되었습니다.');
            render();
          });

          main.querySelectorAll('[data-admin-status]').forEach((sel) => {
            sel.addEventListener('change', () => {
              const id = sel.getAttribute('data-admin-status');
              const val = sel.value;
              state.customIssues = state.customIssues.map((it) => (it.id === id ? { ...it, status: val } : it));
              state.liveIssues = state.liveIssues.map((it) => (it.id === id ? { ...it, status: val } : it));
              safeStorage.set(STORAGE_KEYS.CUSTOM_ISSUES, state.customIssues);
              showToast('상태가 변경되었습니다.');
              render();
            });
          });
        }

        // Global header & nav bindings
        document.querySelectorAll('.site-header [data-nav], .mobile-nav [data-nav], .site-footer [data-nav]').forEach((btn) => {
          btn.addEventListener('click', () => navigate({ name: btn.getAttribute('data-nav') }));
        });

        document.getElementById('btn-theme-toggle')?.addEventListener('click', () => {
          state.prefs.theme = state.prefs.theme === 'dark' ? 'light' : 'dark';
          safeStorage.set(STORAGE_KEYS.PREFS, state.prefs);
          render();
        });

        document.getElementById('btn-download-html')?.addEventListener('click', handleDownloadHtmlClick);

        window.addEventListener('hashchange', () => {
          state.route = parseHash(window.location.hash);
          render();
        });

        // Initial render + immediate RSS sync + 1-hour auto check loop
        render();
        checkAndSyncHourly(false);
        setInterval(() => checkAndSyncHourly(false), HOURLY_INTERVAL_MS);
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible' && Date.now() >= state.syncInfo.nextCheckAt) {
            checkAndSyncHourly(false);
          }
        });
      })();
    </script>
  </body>
</html>
