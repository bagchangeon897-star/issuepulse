<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>IssuePulse · 요즘 무슨 일? — 실시간 이슈 브리핑</title>
    <meta
      name="description"
      content="논란·인명사고·연예·스포츠·테크·글로벌 이슈를 30초 요약과 타임라인, 확인된 사실, 공식 입장으로 한눈에 정리하는 실시간 이슈 브리핑 플랫폼."
    />
    <meta property="og:title" content="IssuePulse · 요즘 무슨 일?" />
    <meta
      property="og:description"
      content="도대체 무슨 일이지? 화제의 사건·이슈를 30초 요약, 타임라인, 팩트체크로 빠르게 파악하세요."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#6D28D9" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f8fafc;
        --surface: #ffffff;
        --surface-muted: #f1f5f9;
        --border: #e2e8f0;
        --border-strong: #cbd5e1;
        --text: #0f172a;
        --text-secondary: #475569;
        --text-muted: #64748b;
        --violet: #6d28d9;
        --violet-hover: #5b21b6;
        --violet-soft: #f5f3ff;
        --violet-border: #ddd6fe;
        --blue: #2563eb;
        --blue-soft: #eff6ff;
        --blue-border: #bfdbfe;
        --rose: #e11d48;
        --amber: #d97706;
        --emerald: #059669;
        --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
        --shadow-lg: 0 20px 45px rgba(15, 23, 42, 0.14);
        --radius-lg: 16px;
        --radius-md: 12px;
        --radius-sm: 8px;
      }

      html.dark {
        --bg: #020617;
        --surface: #0f172a;
        --surface-muted: #1e293b;
        --border: #1e293b;
        --border-strong: #334155;
        --text: #f1f5f9;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;
        --violet: #8b5cf6;
        --violet-hover: #7c3aed;
        --violet-soft: rgba(109, 40, 217, 0.18);
        --violet-border: rgba(139, 92, 246, 0.42);
        --blue: #60a5fa;
        --blue-soft: rgba(37, 99, 235, 0.18);
        --blue-border: rgba(96, 165, 250, 0.4);
        --rose: #fb7185;
        --amber: #fbbf24;
        --emerald: #34d399;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
        --shadow-lg: 0 24px 55px rgba(0, 0, 0, 0.6);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        font-family: 'Plus Jakarta Sans', 'Noto Sans KR', -apple-system, BlinkMacSystemFont,
          'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        padding-bottom: 76px;
      }

      @media (min-width: 768px) {
        body {
          padding-bottom: 0;
        }
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }

      button {
        cursor: pointer;
        border: 0;
        background: transparent;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .font-mono-num {
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        font-variant-numeric: tabular-nums;
      }

      .container {
        width: 100%;
        max-width: 1160px;
        margin: 0 auto;
        padding: 0 16px;
      }

      @media (min-width: 640px) {
        .container {
          padding: 0 24px;
        }
      }

      /* Header */
      .site-header {
        position: sticky;
        top: 0;
        z-index: 40;
        background: color-mix(in srgb, var(--surface) 88%, transparent);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
      }

      .header-inner {
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .brand-btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 4px 0;
        text-align: left;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: linear-gradient(135deg, #6d28d9, #2563eb);
        color: #ffffff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 15px;
        letter-spacing: -0.03em;
        flex-shrink: 0;
      }

      .brand-title {
        font-size: 16px;
        font-weight: 800;
        letter-spacing: -0.02em;
        display: block;
        line-height: 1.15;
      }

      .brand-sub {
        font-size: 11px;
        font-weight: 600;
        color: var(--violet);
        display: block;
      }

      .desktop-nav {
        display: none;
        align-items: center;
        gap: 4px;
      }

      @media (min-width: 768px) {
        .desktop-nav {
          display: flex;
        }
      }

      .nav-btn {
        min-height: 38px;
        padding: 0 13px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-secondary);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        transition: background-color 0.15s, color 0.15s;
      }

      .nav-btn:hover {
        background: var(--surface-muted);
        color: var(--text);
      }

      .nav-btn.active {
        background: var(--violet-soft);
        color: var(--violet);
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .icon-btn {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text-secondary);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: border-color 0.15s, color 0.15s;
      }

      .icon-btn:hover {
        border-color: var(--violet-border);
        color: var(--violet);
      }

      /* Mobile Bottom Nav */
      .mobile-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 40;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        background: color-mix(in srgb, var(--surface) 95%, transparent);
        backdrop-filter: blur(12px);
        border-top: 1px solid var(--border);
        padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
      }

      @media (min-width: 768px) {
        .mobile-nav {
          display: none;
        }
      }

      .mobile-nav-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        padding: 6px 2px;
        font-size: 11px;
        font-weight: 600;
        color: var(--text-muted);
      }

      .mobile-nav-btn.active {
        color: var(--violet);
      }

      /* Shared layout & controls */
      .page-wrap {
        padding-top: 22px;
        padding-bottom: 56px;
      }

      .status-bar {
        display: flex;
        flex-direction: column;
        gap: 10px;
        justify-content: space-between;
        padding: 12px 16px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border);
        background: var(--surface);
        font-size: 12px;
        color: var(--text-secondary);
      }

      @media (min-width: 768px) {
        .status-bar {
          flex-direction: row;
          align-items: center;
        }
      }

      .status-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }

      .status-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      .btn {
        min-height: 38px;
        padding: 0 14px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        white-space: nowrap;
        transition: background-color 0.15s, border-color 0.15s, color 0.15s;
      }

      .btn-primary {
        background: var(--violet);
        color: #ffffff;
      }

      .btn-primary:hover {
        background: var(--violet-hover);
      }

      .btn-secondary {
        background: var(--surface-muted);
        border: 1px solid var(--border);
        color: var(--text);
      }

      .btn-secondary:hover {
        border-color: var(--violet-border);
        color: var(--violet);
      }

      .btn-blue-soft {
        background: var(--blue-soft);
        border: 1px solid var(--blue-border);
        color: var(--blue);
      }

      .btn-violet-soft {
        background: var(--violet-soft);
        border: 1px solid var(--violet-border);
        color: var(--violet);
      }

      /* Category Tabs */
      .tab-bar {
        margin-top: 16px;
        display: flex;
        align-items: center;
        gap: 6px;
        overflow-x: auto;
        padding: 6px;
        border-radius: var(--radius-lg);
        border: 1px solid var(--border);
        background: var(--surface);
      }

      .tab-btn {
        min-height: 38px;
        padding: 0 14px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background-color 0.15s, color 0.15s;
      }

      .tab-btn:hover {
        background: var(--surface-muted);
        color: var(--text);
      }

      .tab-btn.active {
        background: var(--violet);
        color: #ffffff;
      }

      .tab-count {
        font-size: 11px;
        opacity: 0.75;
      }

      /* Section headers */
      .section {
        margin-top: 38px;
      }

      .section-head {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 12px;
        padding-bottom: 12px;
        margin-bottom: 18px;
        border-bottom: 1px solid var(--border);
      }

      @media (min-width: 640px) {
        .section-head {
          flex-direction: row;
          align-items: flex-end;
        }
      }

      .eyebrow {
        font-size: 12px;
        font-weight: 700;
        color: var(--violet);
        margin: 0;
      }

      .h1-title {
        margin: 4px 0 0;
        font-size: clamp(22px, 3vw, 30px);
        font-weight: 800;
        letter-spacing: -0.025em;
        line-height: 1.25;
      }

      .h2-title {
        margin: 0;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .sub-note {
        margin: 2px 0 0;
        font-size: 12px;
        color: var(--text-muted);
      }

      /* Front-Page Lead Grid */
      .hero-grid {
        display: grid;
        gap: 22px;
      }

      @media (min-width: 960px) {
        .hero-grid {
          grid-template-columns: 7fr 5fr;
        }
      }

      .card {
        border-radius: var(--radius-lg);
        border: 1px solid var(--border);
        background: var(--surface);
        overflow: hidden;
        box-shadow: var(--shadow-sm);
      }

      .hero-media {
        aspect-ratio: 16 / 9;
        width: 100%;
        background: var(--surface-muted);
        overflow: hidden;
      }

      .hero-media img,
      .card-media img,
      .detail-figure img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .hero-body {
        padding: 22px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .meta-line {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--text-muted);
      }

      .txt-violet {
        color: var(--violet);
        font-weight: 700;
      }

      .txt-blue {
        color: var(--blue);
        font-weight: 600;
      }

      .txt-rose {
        color: var(--rose);
        font-weight: 800;
      }

      .hero-headline {
        margin: 0;
        font-size: clamp(20px, 2.3vw, 25px);
        font-weight: 800;
        line-height: 1.3;
        letter-spacing: -0.02em;
        cursor: pointer;
      }

      .hero-headline:hover {
        color: var(--violet);
      }

      .hero-sub {
        margin: 0;
        font-size: 14px;
        color: var(--text-secondary);
        line-height: 1.6;
      }

      .hero-summary-list {
        list-style: none;
        margin: 4px 0 0;
        padding: 14px 0 0;
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 13.5px;
      }

      .hero-summary-list li {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }

      .top5-panel {
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .top5-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 6px;
      }

      .top5-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 0;
        border-bottom: 1px solid var(--border);
      }

      .top5-row:last-child {
        border-bottom: 0;
      }

      .top5-link {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        text-align: left;
        flex: 1;
        min-width: 0;
      }

      .top5-link:hover .top5-title {
        color: var(--violet);
      }

      .top5-rank {
        font-size: 13px;
        font-weight: 800;
        color: var(--violet);
        width: 22px;
        flex-shrink: 0;
        margin-top: 2px;
      }

      .top5-title {
        margin: 4px 0 0;
        font-size: 14px;
        font-weight: 700;
        line-height: 1.4;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      /* Sort Toggle */
      .sort-group {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 4px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--surface);
      }

      .sort-btn {
        min-height: 32px;
        padding: 0 10px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      .sort-btn.active {
        background: var(--violet);
        color: #ffffff;
      }

      /* Card Grid */
      .cards-grid {
        display: grid;
        gap: 20px;
        grid-template-columns: 1fr;
      }

      @media (min-width: 640px) {
        .cards-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (min-width: 980px) {
        .cards-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      .issue-card {
        display: flex;
        flex-direction: column;
        height: 100%;
        cursor: pointer;
        transition: transform 0.15s ease, border-color 0.15s ease;
      }

      .issue-card:hover {
        transform: translateY(-2px);
        border-color: var(--violet-border);
      }

      .card-media {
        aspect-ratio: 16 / 10;
        width: 100%;
        background: var(--surface-muted);
        overflow: hidden;
      }

      .card-body {
        padding: 18px;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 14px;
      }

      .card-title {
        margin: 8px 0 0;
        font-size: 17px;
        font-weight: 700;
        line-height: 1.4;
      }

      .issue-card:hover .card-title {
        color: var(--violet);
      }

      .card-desc {
        margin: 8px 0 0;
        font-size: 13.5px;
        color: var(--text-secondary);
        line-height: 1.55;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .card-foot {
        padding-top: 12px;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .metrics-col {
        min-width: 0;
        font-size: 11px;
        color: var(--text-muted);
      }

      .metrics-row {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--text-secondary);
        font-weight: 600;
      }

      .card-btns {
        display: flex;
        align-items: center;
        gap: 5px;
        flex-shrink: 0;
      }

      .mini-btn {
        height: 34px;
        padding: 0 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text-secondary);
        font-size: 11.5px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .mini-btn:hover {
        border-color: var(--violet-border);
        color: var(--violet);
      }

      .mini-btn.followed {
        background: var(--violet);
        border-color: var(--violet);
        color: #ffffff;
      }

      .mini-btn.bookmarked {
        background: var(--blue-soft);
        border-color: var(--blue-border);
        color: var(--blue);
      }

      /* Compact List */
      .compact-list {
        padding: 6px 20px;
      }

      .compact-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
        padding: 15px 0;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
      }

      .compact-row:last-child {
        border-bottom: 0;
      }

      .compact-row:hover .compact-title {
        color: var(--violet);
      }

      .compact-title {
        margin: 4px 0 2px;
        font-size: 15px;
        font-weight: 700;
      }

      .compact-sub {
        margin: 0;
        font-size: 13px;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Explore Search */
      .search-box {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .search-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .input {
        height: 42px;
        padding: 0 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--bg);
        font-size: 14px;
        outline: none;
      }

      .input:focus {
        border-color: var(--violet);
      }

      .textarea {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--bg);
        font-size: 14px;
        outline: none;
        resize: vertical;
      }

      /* Issue Detail */
      .detail-grid {
        display: grid;
        gap: 28px;
        margin-top: 24px;
      }

      @media (min-width: 960px) {
        .detail-grid {
          grid-template-columns: 7fr 5fr;
          align-items: start;
        }
      }

      .detail-box {
        padding: 20px;
      }

      .detail-figure {
        overflow: hidden;
        border-radius: var(--radius-lg);
        border: 1px solid var(--border);
        background: var(--surface);
      }

      .detail-figure img {
        aspect-ratio: 16 / 9;
      }

      .detail-caption {
        padding: 10px 16px;
        border-top: 1px solid var(--border);
        font-size: 12px;
        color: var(--text-muted);
      }

      .summary-box {
        background: var(--violet-soft);
        border: 1px solid var(--violet-border);
        border-radius: var(--radius-lg);
        padding: 20px;
      }

      .fact-grid {
        display: grid;
        gap: 16px;
      }

      @media (min-width: 640px) {
        .fact-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      .timeline-item {
        position: relative;
        padding-left: 20px;
        padding-bottom: 18px;
        border-left: 2px solid var(--border-strong);
      }

      .timeline-item:last-child {
        padding-bottom: 0;
      }

      .timeline-dot {
        position: absolute;
        left: -6px;
        top: 5px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--violet);
      }

      .qa-thread {
        max-height: 360px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px;
        border-radius: 12px;
        background: var(--bg);
        border: 1px solid var(--border);
      }

      .qa-msg {
        padding: 10px 13px;
        border-radius: 10px;
        font-size: 13px;
        line-height: 1.55;
      }

      .qa-msg.user {
        align-self: flex-end;
        max-width: 85%;
        background: var(--violet);
        color: #ffffff;
      }

      .qa-msg.bot {
        align-self: flex-start;
        max-width: 92%;
        background: var(--surface);
        border: 1px solid var(--border);
      }

        function classifyIssueCategory(text, fallbackCategory) {
          const normalized = String(text || '').toLowerCase();
          const scores = [];
          const matchedAll = [];

          for (const rule of CATEGORY_RULES) {
            let hits = 0;
            const matched = [];
            for (const kw of rule.keywords) {
              if (normalized.includes(kw.toLowerCase())) {
                hits++;
                matched.push(kw);
              }
            }
            if (hits > 0) {
              scores.push({
                category: rule.category,
                score: hits * rule.baseWeight,
                matched,
              });
              matchedAll.push(...matched);
            }
          }

          scores.sort((a, b) => b.score - a.score);
          if (scores.length === 0) {
            return {
              primaryCategory: fallbackCategory || 'controversy',
              secondaryCategories: [],
              confidence: 0.45,
              matchedKeywords: [],
              method: 'feed_fallback',
            };
          }
          const primary = scores[0];
          const secondary = scores
            .slice(1, 3)
            .filter((s) => s.score >= primary.score * 0.45)
            .map((s) => s.category);

          return {
            primaryCategory: primary.category,
            secondaryCategories: secondary,
            confidence: Math.min(0.98, 0.55 + primary.score * 0.12),
            matchedKeywords: Array.from(new Set(matchedAll)).slice(0, 6),
            method: 'keyword_rules',

            const base = computeMetrics(item.id, item.heatIndex, (item.sources || []).length);
            const delta = metricsMap[item.id] || { views: 0, follows: 0 };
            return {
              ...item,
              coverImage: media.coverImage,
              coverAlt: media.coverAlt,
              viewCount: Math.max(0, (item.viewCount ?? base.viewCount) + (delta.views || 0)),
              followCount: Math.max(0, (item.followCount ?? base.followCount) + (delta.follows || 0)),
              updatedAt: item.publishedTimestamp ? formatRelativeTime(item.publishedTimestamp) : item.updatedAt,

          });

        }

        async function fetchViaCorsRss(feedUrl) {
          // 1) Try rss2json (clean JSON with CORS)
          try {
            const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feedUrl)}`;
            const res = await fetch(apiUrl, { signal: AbortSignal.timeout(7000) });
            if (res.ok) {
              const data = await res.json();
              if (data.status === 'ok' && Array.isArray(data.items) && data.items.length > 0) {
                return data.items.map((it) => ({
                  rawTitle: it.title || '',
                  link: it.link || '',
                  pubDate: it.pubDate || '',
                  author: it.author || '',
                }));
              }
            }
          } catch (_) {}

          // 2) Fallback: allorigins XML proxy
          try {
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(feedUrl)}`;
            const res = await fetch(proxyUrl, { signal: AbortSignal.timeout(7000) });
            if (res.ok) {
              const xmlText = await res.text();
              const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
              const items = Array.from(doc.querySelectorAll('item')).slice(0, 8);
              return items.map((el) => ({
                rawTitle: el.querySelector('title')?.textContent || '',
                link: el.querySelector('link')?.textContent || '',
                pubDate: el.querySelector('pubDate')?.textContent || '',
                author: el.querySelector('source')?.textContent || '',
              }));
            }
          } catch (_) {}

          return [];
        }

        async function fetchLiveFeeds(customQuery) {
          // If served on same origin HTTP(S), try backend API first (automatically skipped on file:// or static Vercel)
          if (window.location.protocol !== 'file:') {
            try {
              const endpoint = customQuery
                ? `/api/issues/search-live?q=${encodeURIComponent(customQuery)}`
                : '/api/issues';
              const res = await fetch(endpoint, { signal: AbortSignal.timeout(4500) });
              const ctype = res.headers.get('content-type') || '';
              if (res.ok && ctype.includes('application/json')) {
                const payload = await res.json();
                const list = customQuery ? payload.issues : payload.liveIssues;
                if (Array.isArray(list) && list.length > 0) {
                  return {
                    issues: list,
                    originLabel: '실시간 RSS 서버 수집',
                  };
                }
              }
            } catch (_) {}
          }

          const targetFeeds = customQuery
            ? [{ category: 'controversy', scope: 'domestic', q: `${customQuery} when:7d` }]
            : RSS_QUERIES;

          const results = await Promise.allSettled(
            targetFeeds.map(async (feed) => {
              const items = await fetchViaCorsRss(buildGoogleRssUrl(feed));
              return { feed, items };
            })
          );

          const collected = [];
          const seenHeadlines = new Set();

          for (const r of results) {
            if (r.status !== 'fulfilled') continue;
            const { feed, items } = r.value;
            const sorted = items
              .map((it) => ({ ...it, pubMs: Date.parse(it.pubDate) || Date.now() }))
              .sort((a, b) => b.pubMs - a.pubMs)
              .slice(0, customQuery ? 6 : 4);

            sorted.forEach((it, idx) => {
              const { headline, publisher } = cleanHeadline(it.rawTitle);
              if (!headline || seenHeadlines.has(headline)) return;
              seenHeadlines.add(headline);
              const pubName = it.author || publisher;
              const auto = classifyIssueCategory(headline, feed.category);
              const cat = auto.primaryCategory;
              const ageHrs = Math.max(0, (Date.now() - it.pubMs) / 3600000);
              const isBreaking = ageHrs <= 2.5 || headline.includes('속보');
              const heatIndex = Math.min(99, Math.max(72, 85 - idx * 2 + (ageHrs <= 3 ? 8 : 2)));
              const id = `rss-${cat}-${quickHash(headline + it.link)}`;

              collected.push({
                id,
                title: headline,
                subtitle: `${pubName}에서 보도한 실시간 자동 수집 이슈입니다.`,
                category: cat,
                scope: feed.scope === 'global' || cat === 'global' ? 'global' : 'domestic',
                regionLabel: cat === 'global' ? '글로벌 주요 이슈' : `국내 · ${CATEGORY_LABELS[cat]}`,
                status: inferStatus(headline),
                isFeaturedToday: idx === 0 && (cat === 'controversy' || cat === 'fatal_accident'),
                isTrending: idx === 0 || isBreaking,
                isNewDiscovery: ageHrs <= 8 || idx === 1,
                isBreaking,
                heatIndex,
                publishedTimestamp: it.pubMs,
                tags: Array.from(new Set([CATEGORY_LABELS[cat], ...auto.matchedKeywords])).slice(0, 4),
                summary30s: [
                  `[${pubName}] ${headline}`,
                  'Google News KR 실시간 RSS 피드를 통해 자동으로 수집 및 분류된 최신 기사입니다.',
                  '하단 원문 출처 링크를 통해 해당 언론사의 전체 보도 내용을 바로 확인할 수 있습니다.',
                ],
                background: {
                  overview: '브라우저에서 실시간 RSS 피드를 직접 조회해 키워드 자동 분류를 거친 이슈입니다.',
                  keyTerms: [],
                },
                timeline: [
                  {
                    id: `tl-${id}`,
                    dateLabel: formatRelativeTime(it.pubMs),
                    stage: '실시간 수집',
                    title: headline,
                    description: `${pubName} 보도 항목`,
                    sourceLabel: pubName,
                  },
                ],
                verifiedFacts: [
                  { id: `vf-${id}`, statement: `${pubName}에서 해당 내용을 보도했습니다.`, basis: '실시간 RSS 헤드라인 확인' },
                ],
                unverifiedClaims: [],
                officialStatements: [],
                sources: [
                  {
                    id: `src-${id}`,
                    title: headline,
                    publisher: pubName,
                    url: it.link,
                    publishedAt: formatRelativeTime(it.pubMs),
                    isSamplePlaceholder: false,
                  },
                ],
                isSampleData: false,
                dataOrigin: 'live_rss',
                autoClassified: auto,
              });
            });
          }

          return {
            issues: collected.sort((a, b) => b.heatIndex - a.heatIndex || b.publishedTimestamp - a.publishedTimestamp),
            originLabel: '실시간 브라우저 RSS 수집',
          };
        }

        // =========================================================
        // 6. Application State
        // =========================================================
        const state = {
          route: parseHash(window.location.hash),
          previousRoute: { name: 'home' },
          selectedCategory: 'all',
          sortMode: 'heat',
          exploreQuery: '',
          exploreCategory: 'all',
          exploreScope: 'all',
          savedTab: 'followed',
          refreshing: false,
          searchingLive: false,
          liveIssues: safeStorage.get(STORAGE_KEYS.CACHED_LIVE, []),
          customIssues: safeStorage.get(STORAGE_KEYS.CUSTOM_ISSUES, RAW_SAMPLE_ISSUES),
          followedIds: safeStorage.get(STORAGE_KEYS.FOLLOWED, ['issue-ent-couple-divorce-sample', 'issue-kbo-stove-league-sample']),
          bookmarkedIds: safeStorage.get(STORAGE_KEYS.BOOKMARKED, []),
          recentSearches: safeStorage.get(STORAGE_KEYS.SEARCHES, ['이혼', '화재', '교통사고', '스토브리그', '젠슨황']),
          prefs: safeStorage.get(STORAGE_KEYS.PREFS, {
            displayName: '이슈 독자',
            theme: 'light',
            preferredCategories: ['controversy', 'fatal_accident', 'entertainment', 'sports', 'tech_economy', 'global'],
            notifications: { followUpdates: true, breakingIncidents: true, dailyBriefing: false },
          }),
          syncInfo: {
            lastCheckedAt: null,
            nextCheckAt: Date.now() + HOURLY_INTERVAL_MS,
            lastNewCount: 0,
            hasNewUpdates: false,
            liveCount: 0,
            modeLabel: '내장 브리핑 대기',
          },
          qaMessagesByIssue: {},
          showAdminForm: false,
          timelineTargetId: null,
        };

        function parseHash(hash) {
          const clean = String(hash || '').replace(/^#/, '');
          if (!clean || clean === 'home') return { name: 'home' };
          if (clean === 'explore') return { name: 'explore' };
          if (clean === 'saved') return { name: 'saved' };
          if (clean === 'mypage') return { name: 'mypage' };
          if (clean === 'admin') return { name: 'admin' };
          if (clean.startsWith('issue/')) return { name: 'detail', issueId: clean.slice(6) };
          return { name: 'home' };
        }

        function navigate(next) {
          if (next.name === 'detail' && state.route.name !== 'detail') {
            state.previousRoute = state.route;
          }
          state.route = next;
          const hash = next.name === 'detail' ? `#issue/${next.issueId}` : `#${next.name}`;
          if (window.location.hash !== hash) window.location.hash = hash;
          window.scrollTo({ top: 0, behavior: 'smooth' });
          render();
        }

        function getAllIssues() {
          const live = hydrateMediaAndMetrics(state.liveIssues || []);
          const seen = new Set(live.map((i) => i.id));
          const samples = hydrateMediaAndMetrics(state.customIssues || []).filter((i) => !seen.has(i.id));
          return [...live, ...samples];
        }

        function sortIssues(list, mode) {
          return [...list].sort((a, b) => {
            if (mode === 'latest') return (b.publishedTimestamp || 0) - (a.publishedTimestamp || 0) || b.heatIndex - a.heatIndex;
            if (mode === 'views') return (b.viewCount || 0) - (a.viewCount || 0) || b.heatIndex - a.heatIndex;
            if (mode === 'follows') return (b.followCount || 0) - (a.followCount || 0) || b.heatIndex - a.heatIndex;
            return b.heatIndex - a.heatIndex;
          });
        }

        function matchesCategory(issue, cat) {
          if (cat === 'all') return true;
          return (
            issue.category === cat ||
            Boolean(issue.autoClassified && (issue.autoClassified.secondaryCategories || []).includes(cat)) ||
            (cat === 'global' && issue.scope === 'global')
          );
        }

        function esc(str) {
          return String(str ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        function formatNum(n) {
          const v = Math.max(0, Math.round(n || 0));
          if (v >= 10000) return (v / 10000).toFixed(1).replace(/\.0$/, '') + '만';
          if (v >= 1000) return (v / 1000).toFixed(1).replace(/\.0$/, '') + '천';
          return v.toLocaleString('ko-KR');
        }

        function formatTime(ts) {
          if (!ts) return '확인 대기';
          return new Date(ts).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
        }

        let toastTimer = null;
        function showToast(msg) {
          const el = document.getElementById('toast-root');
          if (!el) return;
          el.textContent = msg;
          el.classList.remove('hidden');
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => el.classList.add('hidden'), 2800);
        }

        // =========================================================
        // 7. Actions (Sync, Follow, Bookmark, View, Export, QA)
        // =========================================================
        async function checkAndSyncHourly(isManual = false) {
          if (state.refreshing) return;
          state.refreshing = true;
          render();

          try {
            const { issues: fetched, originLabel } = await fetchLiveFeeds();
            state.syncInfo.lastCheckedAt = Date.now();
            state.syncInfo.nextCheckAt = Date.now() + HOURLY_INTERVAL_MS;

            if (fetched.length > 0) {
              const prevIds = new Set(state.liveIssues.map((i) => i.id));
              const prevTitles = new Set(state.liveIssues.map((i) => i.title.trim()));
              const newOnes = fetched.filter((i) => !prevIds.has(i.id) && !prevTitles.has(i.title.trim()));
              const isInitial = state.liveIssues.length === 0;

              if (isInitial || newOnes.length > 0) {
                state.liveIssues = fetched;
                safeStorage.set(STORAGE_KEYS.CACHED_LIVE, fetched);
                state.syncInfo.liveCount = fetched.length;
                state.syncInfo.lastNewCount = isInitial ? fetched.length : newOnes.length;
                state.syncInfo.hasNewUpdates = true;
                state.syncInfo.modeLabel = originLabel;
                if (!isInitial) {
                  showToast(`새로운 이슈 ${newOnes.length}건을 발견해 피드를 자동 업데이트했습니다.`);
                } else if (isManual) {
                  showToast(`실시간 이슈 ${fetched.length}건을 불러왔습니다.`);
                }
              } else {
                state.syncInfo.lastNewCount = 0;
                state.syncInfo.hasNewUpdates = false;
                if (isManual) showToast('새로운 이슈가 없어 현재 최신 피드를 유지합니다.');
              }
            } else {
              state.syncInfo.liveCount = state.liveIssues.length;
              state.syncInfo.modeLabel = state.liveIssues.length > 0 ? '캐시된 실시간 피드' : '내장 브리핑 데이터';
              if (isManual) showToast('외부 RSS 응답이 지연되어 현재 피드를 유지합니다.');
            }
          } finally {
            state.refreshing = false;
            render();
          }
        }

        function bumpMetric(id, viewsDelta, followsDelta) {
          const metrics = safeStorage.get(STORAGE_KEYS.METRICS, {});
          const prev = metrics[id] || { views: 0, follows: 0 };
          metrics[id] = {
            views: Math.max(0, (prev.views || 0) + viewsDelta),
            follows: (prev.follows || 0) + followsDelta,
          };
          safeStorage.set(STORAGE_KEYS.METRICS, metrics);
        }

        function openIssueDetail(id) {
          bumpMetric(id, 1, 0);
          if (window.location.protocol !== 'file:') {
            fetch(`/api/issues/${encodeURIComponent(id)}/view`, { method: 'POST' }).catch(() => {});
          }
          navigate({ name: 'detail', issueId: id });
        }

        function toggleFollow(id) {
          const exists = state.followedIds.includes(id);
          state.followedIds = exists
            ? state.followedIds.filter((x) => x !== id)
            : [id, ...state.followedIds];
          safeStorage.set(STORAGE_KEYS.FOLLOWED, state.followedIds);
          bumpMetric(id, 0, exists ? -1 : 1);
          if (window.location.protocol !== 'file:') {
            fetch(`/api/issues/${encodeURIComponent(id)}/follow`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ following: !exists }),
            }).catch(() => {});
          }
          showToast(exists ? '이슈 팔로우를 해제했습니다.' : '관심 이슈에 추가되었습니다.');
          render();
        }

        function toggleBookmark(id) {
          const exists = state.bookmarkedIds.includes(id);
          state.bookmarkedIds = exists
            ? state.bookmarkedIds.filter((x) => x !== id)
            : [id, ...state.bookmarkedIds];
          safeStorage.set(STORAGE_KEYS.BOOKMARKED, state.bookmarkedIds);
          showToast(exists ? '북마크에서 제거했습니다.' : '북마크에 저장했습니다.');
          render();
        }

        function openQuickModal(id) {
          const issue = getAllIssues().find((i) => i.id === id);
          if (!issue) return;
          const modalRoot = document.getElementById('modal-root');
          const followed = state.followedIds.includes(issue.id);
          modalRoot.innerHTML = `
            <div class="modal-backdrop" id="modal-backdrop">
              <div class="modal-card" id="modal-card">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1px solid var(--border);padding-bottom:14px;">
                  <div>
                    <div class="meta-line">
                      <span class="txt-blue">30초 퀵 브리핑</span>
                      <span>·</span>
                      <span class="txt-violet">${esc(CATEGORY_LABELS[issue.category])}</span>
                      <span>·</span>
                      <span class="font-mono-num">${esc(issue.updatedAt)}</span>
                      <span>·</span>
                      <span class="font-mono-num">조회 ${formatNum(issue.viewCount)}</span>
                    </div>
                    <h2 style="margin:6px 0 0;font-size:19px;font-weight:800;line-height:1.35;">${esc(issue.title)}</h2>
                  </div>
                  <button type="button" class="icon-btn" id="modal-close" aria-label="닫기">✕</button>
                </div>

                <div class="summary-box" style="margin-top:16px;">
                  <p class="eyebrow" style="margin-bottom:10px;">핵심 3줄 요약</p>
                  <ol style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:14px;">
                    ${issue.summary30s.map((s) => `<li>${esc(s)}</li>`).join('')}
                  </ol>
                </div>

                ${
                  issue.sources && issue.sources.length
                    ? `<div style="margin-top:16px;">
                        <p style="margin:0 0 8px;font-size:12px;font-weight:700;">출처 (${issue.sources.length}건)</p>
                        <div class="card" style="padding:8px 14px;">
                          ${issue.sources
                            .slice(0, 3)
                            .map(
                              (src) => `
                            <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px;">
                              <div style="min-width:0;">
                                <div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(src.title)}</div>
                                <div style="color:var(--text-muted);font-size:11px;">${esc(src.publisher)}</div>
                              </div>
                              ${
                                !src.isSamplePlaceholder && src.url
                                  ? `<a href="${esc(src.url)}" target="_blank" rel="noopener noreferrer" class="txt-blue" style="flex-shrink:0;font-size:12px;">원문 ↗</a>`
                                  : ''
                              }
                            </div>`
                            )
                            .join('')}
                        </div>
                      </div>`
                    : ''
                }

                <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid var(--border);">
                  <button type="button" class="btn ${followed ? 'btn-violet-soft' : 'btn-secondary'}" data-modal-follow="${esc(issue.id)}">
                    ${followed ? '팔로우 중' : '이슈 팔로우'}
                  </button>
                  <button type="button" class="btn btn-primary" data-modal-detail="${esc(issue.id)}">
                    전체 타임라인 · 팩트체크 보기 →
                  </button>
                </div>
              </div>
            </div>`;

          document.getElementById('modal-backdrop').addEventListener('click', (e) => {
            if (e.target.id === 'modal-backdrop' || e.target.id === 'modal-close') {
              modalRoot.innerHTML = '';
            }
          });
          modalRoot.querySelector('[data-modal-follow]')?.addEventListener('click', () => {
            toggleFollow(issue.id);
            openQuickModal(issue.id);
          });
          modalRoot.querySelector('[data-modal-detail]')?.addEventListener('click', () => {
            modalRoot.innerHTML = '';
            openIssueDetail(issue.id);
          });
        }

        function answerQuestionLocally(issue, q) {
          const lower = q.toLowerCase();
          if (/사실|미확인|루머|팩트/.test(lower)) {
            const vf = issue.verifiedFacts.map((f) => `• [확인된 사실] ${f.statement} (${f.basis})`).join('\n');
            const uc = issue.unverifiedClaims.length
              ? issue.unverifiedClaims.map((u) => `• [미확인 주장] ${u.claim} — ${u.context}`).join('\n')
              : '• 현재 분류된 미확인 주장 항목은 없습니다.';
            return `${vf || '• 확인된 사실 요약 대기 중'}\n\n${uc}`;
          }
          if (/타임라인|흐름|언제|순서/.test(lower)) {
            return issue.timeline.length
              ? issue.timeline.map((t) => `• [${t.dateLabel} · ${t.stage}] ${t.title}: ${t.description}`).join('\n')
              : '아직 세부 타임라인이 등록되지 않았습니다. 아래 출처 기사에서 시간순 경위를 확인할 수 있습니다.';
          }
          if (/입장|공식|발표/.test(lower)) {
            return issue.officialStatements.length
              ? issue.officialStatements.map((o) => `• ${o.speaker} (${o.role}): ${o.summary}`).join('\n')
              : '현재까지 등록된 공식 입장문 요약이 없습니다.';
          }
          return `30초 핵심 요약:\n${issue.summary30s.map((s, idx) => `${idx + 1}. ${s}`).join('\n')}\n\n배경: ${issue.background.overview}`;
        }

        function exportBriefings(format) {
          const issues = getAllIssues();
          let content = '';
          let filename = '';
          let mime = 'text/plain;charset=utf-8';

          if (format === 'json') {
            content = JSON.stringify(issues, null, 2);
            filename = `issuepulse-briefings-${new Date().toISOString().slice(0, 10)}.json`;
            mime = 'application/json;charset=utf-8';
          } else {
            content = issues
              .map(
                (i, idx) =>
                  `## ${idx + 1}. [${CATEGORY_LABELS[i.category]}] ${i.title}\n- 상태: ${STATUS_LABELS[i.status]} | 주목도: ${i.heatIndex} | 업데이트: ${i.updatedAt}\n- 부제: ${i.subtitle}\n- 30초 요약:\n  1) ${i.summary30s[0]}\n  2) ${i.summary30s[1]}\n  3) ${i.summary30s[2]}\n`
              )
              .join('\n---\n\n');
            filename = `issuepulse-briefings-${new Date().toISOString().slice(0, 10)}.md`;
          }

          const blob = new Blob([content], { type: mime });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          showToast(`${filename} 파일을 내려받았습니다.`);
        }

        function handleDownloadHtmlClick(e) {
          if (window.location.protocol === 'file:') {
            e.preventDefault();
            showToast('이미 로컬 단일 index.html 파일로 실행 중입니다.');
            return;
          }
          showToast('index.html 파일 다운로드를 시작합니다.');
        }

        async function copyFullHtmlCode() {
          try {
            let htmlText = '';
            if (window.location.protocol !== 'file:') {
              const res = await fetch('/index.html');
              if (res.ok) htmlText = await res.text();
            }
            if (!htmlText) {
              htmlText = '<!doctype html>\n' + document.documentElement.outerHTML;
            }
            await navigator.clipboard.writeText(htmlText);
            showToast('전체 index.html 코드를 클립보드에 복사했습니다.');
          } catch (_) {
            showToast('클립보드 복사에 실패했습니다. 상단 다운로드 버튼을 이용해 주세요.');
          }
        }

        // =========================================================
        // 8. HTML Card & Page Renderers
        // =========================================================
        function renderIssueCard(issue, rank) {
          const followed = state.followedIds.includes(issue.id);
          const bookmarked = state.bookmarkedIds.includes(issue.id);
          const originTxt = issue.dataOrigin === 'live_rss' ? '실시간 RSS' : '내장 브리핑';

          return `
            <article class="card issue-card" data-open-issue="${esc(issue.id)}">
              <div class="card-media">
                <img src="${esc(issue.coverImage)}" alt="${esc(issue.coverAlt || issue.title)}" />
              </div>
              <div class="card-body">
                <div>
                  <div class="meta-line">
                    ${typeof rank === 'number' ? `<span class="font-mono-num txt-violet">#${rank}</span><span>·</span>` : ''}
                    ${issue.isBreaking ? `<span class="txt-rose">속보</span><span>·</span>` : ''}
                    <span style="font-weight:700;color:var(--text-secondary);">${esc(CATEGORY_LABELS[issue.category])}</span>
                    <span>·</span>
                    <span class="txt-violet">${esc(STATUS_LABELS[issue.status])}</span>
                    <span>·</span>
                    <span class="txt-blue">${esc(originTxt)}</span>
                  </div>
                  <h3 class="card-title">${esc(issue.title)}</h3>
                  <p class="card-desc">${esc(issue.subtitle)}</p>
                </div>

                <div class="card-foot">
                  <div class="metrics-col">
                    <div class="metrics-row font-mono-num">
                      <span>조회 ${formatNum(issue.viewCount)}</span>
                      <span>팔로우 ${formatNum(issue.followCount)}</span>
                    </div>
                    <div class="font-mono-num">${esc(issue.updatedAt)}</div>
                  </div>

                  <div class="card-btns">
                    <button type="button" class="mini-btn" data-quick-brief="${esc(issue.id)}">30초</button>
                    <button type="button" class="mini-btn ${bookmarked ? 'bookmarked' : ''}" data-bookmark="${esc(issue.id)}" aria-label="북마크">
                      ${bookmarked ? '저장됨' : '저장'}
                    </button>
                    <button type="button" class="mini-btn ${followed ? 'followed' : ''}" data-follow="${esc(issue.id)}">
                      ${followed ? '팔로잉' : '팔로우'}
                    </button>
                  </div>
                </div>
              </div>
            </article>`;
        }

        function renderSortGroup() {
          const modes = [
            { id: 'latest', label: '최신속보순' },
            { id: 'views', label: '조회수순' },
            { id: 'follows', label: '팔로우순' },
            { id: 'heat', label: '주목도순' },
          ];
          return `
            <div class="sort-group" role="group" aria-label="실시간 인기 이슈 정렬">
              ${modes
                .map(
                  (m) => `
                <button type="button" class="sort-btn ${state.sortMode === m.id ? 'active' : ''}" data-sort="${m.id}">
                  ${m.label}
                </button>`
                )
                .join('')}
            </div>`;
        }

        function renderHomePage(allIssues) {
          const counts = { all: allIssues.length };
          CATEGORY_TABS.forEach((t) => {
            if (t.id !== 'all') counts[t.id] = allIssues.filter((i) => matchesCategory(i, t.id)).length;
          });

          const filteredList = sortIssues(
            state.selectedCategory === 'all'
              ? allIssues
              : allIssues.filter((i) => matchesCategory(i, state.selectedCategory)),
            state.sortMode
          );

          const liveCandidates = allIssues.filter((i) => i.dataOrigin === 'live_rss');
          const featured =
            sortIssues(liveCandidates, 'heat')[0] ||
            allIssues.find((i) => i.isFeaturedToday) ||
            allIssues[0];
          const top5 = sortIssues(
            allIssues.filter((i) => i.id !== featured?.id),
            'heat'
          ).slice(0, 5);
          const trending = sortIssues(
            allIssues.filter((i) => i.id !== featured?.id),
            state.sortMode
          ).slice(0, 6);
          const newDiscoveries = sortIssues(
            allIssues.filter((i) => i.isNewDiscovery || i.isBreaking),
            'latest'
          ).slice(0, 6);
          const globals = sortIssues(
            allIssues.filter((i) => i.scope === 'global' || i.category === 'global'),
            state.sortMode
          ).slice(0, 6);

          const statusHtml = `
            <div class="status-bar">
              <div class="status-meta">
                <strong style="color:var(--text);">1시간마다 새 이슈 자동 확인·업데이트</strong>
                <span>·</span>
                <span>모드: <strong class="txt-blue">${esc(state.syncInfo.modeLabel)}</strong></span>
                <span>·</span>
                <span class="font-mono-num">최근 확인 ${formatTime(state.syncInfo.lastCheckedAt)}</span>
                <span>·</span>
                <span class="font-mono-num">다음 확인 ${formatTime(state.syncInfo.nextCheckAt)}</span>
                ${
                  state.syncInfo.hasNewUpdates && state.syncInfo.lastNewCount > 0
                    ? `<span>·</span><span class="txt-violet">신규 ${state.syncInfo.lastNewCount}건 반영</span>`
                    : ''
                }
              </div>
              <div class="status-actions">
                <a href="/index.html?download=1" download="index.html" class="btn btn-primary" data-dl-html>
                  index.html 다운로드
                </a>
                <button type="button" class="btn btn-secondary" id="btn-refresh-live" ${state.refreshing ? 'disabled' : ''}>
                  <span class="${state.refreshing ? 'spin' : ''}">↻</span>
                  <span>${state.refreshing ? '확인 중...' : '새 이슈 지금 확인'}</span>
                </button>
              </div>
            </div>`;

          const tabsHtml = `
            <div class="tab-bar" role="tablist" aria-label="카테고리 필터">
              ${CATEGORY_TABS.map(
                (t) => `
                <button type="button" role="tab" aria-selected="${state.selectedCategory === t.id}" class="tab-btn ${state.selectedCategory === t.id ? 'active' : ''}" data-cat-tab="${t.id}">
                  <span>${t.label}</span>
                  <span class="font-mono-num tab-count">${counts[t.id] || 0}</span>
                </button>`
              ).join('')}
            </div>`;

          if (state.selectedCategory !== 'all') {
            return `
              ${statusHtml}
              ${tabsHtml}
              <section class="section">
                <div class="section-head">
                  <div>
                    <p class="eyebrow">자동 분류 피드</p>
                    <h1 class="h1-title">${esc(CATEGORY_LABELS[state.selectedCategory])} 이슈 (${filteredList.length})</h1>
                  </div>
                  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;">
                    ${renderSortGroup()}
                    <button type="button" class="btn btn-secondary" data-cat-tab="all">전체 보기</button>
                  </div>
                </div>
                ${
                  filteredList.length
                    ? `<div class="cards-grid">${filteredList.map((it, i) => renderIssueCard(it, i + 1)).join('')}</div>`
                    : `<div class="empty-box"><p>해당 카테고리에 등록된 이슈가 없습니다.</p></div>`
                }
              </section>`;
          }

          const featuredFollowed = featured && state.followedIds.includes(featured.id);

          return `
            ${statusHtml}
            ${tabsHtml}

            <section class="section">
              <div class="section-head">
                <div>
                  <p class="eyebrow">요즘 가장 화제인 사건 · 한눈에 보기</p>
                  <h1 class="h1-title">지금 가장 이슈화된 사건</h1>
                </div>
                <span class="sub-note font-mono-num">화제성 · 최신성 · 자동 분류 반영</span>
              </div>

              ${
                featured
                  ? `
                <div class="hero-grid">
                  <div class="card">
                    <div class="hero-media">
                      <img src="${esc(featured.coverImage)}" alt="${esc(featured.coverAlt || featured.title)}" />
                    </div>
                    <div class="hero-body">
                      <div class="meta-line">
                        <span class="font-mono-num txt-violet">#1 핫이슈</span>
                        <span>·</span>
                        ${featured.isBreaking ? `<span class="txt-rose">속보</span><span>·</span>` : ''}
                        <span class="txt-violet">${esc(CATEGORY_LABELS[featured.category])}</span>
                        <span>·</span>
                        <span class="txt-blue">${esc(STATUS_LABELS[featured.status])}</span>
                        <span>·</span>
                        <span class="font-mono-num">${esc(featured.updatedAt)}</span>
                      </div>
                      <h2 class="hero-headline" data-open-issue="${esc(featured.id)}">${esc(featured.title)}</h2>
                      <p class="hero-sub">${esc(featured.subtitle)}</p>
                      <ul class="hero-summary-list">
                        ${featured.summary30s
                          .slice(0, 2)
                          .map(
                            (line, idx) => `
                          <li>
                            <span class="font-mono-num txt-blue">0${idx + 1}</span>
                            <span>${esc(line)}</span>
                          </li>`
                          )
                          .join('')}
                      </ul>
                      <div style="display:flex;flex-wrap:wrap;gap:8px;padding-top:6px;">
                        <button type="button" class="btn btn-primary" data-open-issue="${esc(featured.id)}">전체 브리핑 읽기 →</button>
                        <button type="button" class="btn btn-blue-soft" data-quick-brief="${esc(featured.id)}">30초 퀵뷰</button>
                        <button type="button" class="btn ${featuredFollowed ? 'btn-violet-soft' : 'btn-secondary'}" data-follow="${esc(featured.id)}">
                          ${featuredFollowed ? '팔로잉' : '후속 알림'}
                        </button>
                      </div>
                    </div>
                  </div>

                  <div class="card top5-panel">
                    <div>
                      <div class="top5-head">
                        <strong style="font-size:15px;">지금 뜨는 사건 한눈에 TOP 5</strong>
                        <span style="font-size:11px;color:var(--text-muted);">클릭 시 바로 이동</span>
                      </div>
                      <div>
                        ${top5
                          .map(
                            (item, idx) => `
                          <div class="top5-row">
                            <button type="button" class="top5-link" data-open-issue="${esc(item.id)}">
                              <span class="font-mono-num top5-rank">0${idx + 2}</span>
                              <div style="min-width:0;">
                                <div class="meta-line" style="font-size:11px;">
                                  ${item.isBreaking ? `<span class="txt-rose">속보</span><span>·</span>` : ''}
                                  <span style="font-weight:700;">${esc(CATEGORY_LABELS[item.category])}</span>
                                  <span>·</span>
                                  <span class="font-mono-num">${esc(item.updatedAt)}</span>
                                </div>
                                <p class="top5-title">${esc(item.title)}</p>
                              </div>
                            </button>
                            <button type="button" class="mini-btn" data-quick-brief="${esc(item.id)}">30초</button>
                          </div>`
                          )
                          .join('')}
                      </div>
                    </div>
                    <div style="display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid var(--border);font-size:12px;">
                      <span style="color:var(--text-muted);">원하는 사건이 없나요?</span>
                      <button type="button" class="txt-blue" data-nav="explore">키워드 실시간 검색 →</button>
                    </div>
                  </div>
                </div>`
                  : ''
              }
            </section>

            <section class="section">
              <div class="section-head">
                <div>
                  <h2 class="h2-title">실시간 인기 이슈</h2>
                  <p class="sub-note">조회수·팔로우 수·최신속보 기준으로 즉시 전환해 볼 수 있습니다.</p>
                </div>
                ${renderSortGroup()}
              </div>
              <div class="cards-grid">
                ${trending.map((it, i) => renderIssueCard(it, i + 1)).join('')}
              </div>
            </section>

            <section class="section">
              <div class="section-head">
                <h2 class="h2-title">신규 발견 이슈</h2>
                <span class="font-mono-num sub-note">${newDiscoveries.length}건</span>
              </div>
              <div class="card compact-list">
                ${newDiscoveries
                  .map(
                    (it, idx) => `
                  <div class="compact-row" data-open-issue="${esc(it.id)}">
                    <div style="display:flex;gap:12px;min-width:0;flex:1;">
                      <span class="font-mono-num txt-violet" style="font-weight:800;margin-top:2px;">0${idx + 1}</span>
                      <div style="min-width:0;flex:1;">
                        <div class="meta-line" style="font-size:11.5px;">
                          ${it.isBreaking ? `<span class="txt-rose">속보</span><span>·</span>` : ''}
                          <span>${esc(CATEGORY_LABELS[it.category])}</span>
                          <span>·</span>
                          <span class="font-mono-num">${esc(it.updatedAt)}</span>
                          <span>·</span>
                          <span class="font-mono-num">조회 ${formatNum(it.viewCount)}</span>
                        </div>
                        <p class="compact-title">${esc(it.title)}</p>
                        <p class="compact-sub">${esc(it.subtitle)}</p>
                      </div>
                    </div>
                    <button type="button" class="mini-btn" data-quick-brief="${esc(it.id)}">30초</button>
                  </div>`
                  )
                  .join('')}
              </div>
            </section>

            <section class="section">
              <div class="section-head">
                <div>
                  <h2 class="h2-title">글로벌 이슈</h2>
                  <p class="sub-note">한국 시장과 이용자 환경에 영향을 주는 해외 핵심 동향</p>
                </div>
                <button type="button" class="txt-blue" style="font-size:12px;" data-cat-tab="global">글로벌 필터 보기</button>
              </div>
              <div class="cards-grid">
                ${globals.map((it) => renderIssueCard(it)).join('')}
              </div>
            </section>`;
        }

        function renderExplorePage(allIssues) {
          const q = state.exploreQuery.trim().toLowerCase();
          const filtered = sortIssues(
            allIssues.filter((i) => {
              if (!matchesCategory(i, state.exploreCategory)) return false;
              if (state.exploreScope !== 'all' && i.scope !== state.exploreScope) return false;
              if (!q) return true;
              const hay = `${i.title} ${i.subtitle} ${(i.tags || []).join(' ')} ${i.regionLabel}`.toLowerCase();
              return hay.includes(q);
            }),
            state.sortMode
          );

          return `
            <div class="stack-lg">
              <div>
                <p class="eyebrow">이슈 탐색</p>
                <h1 class="h1-title">카테고리 · 키워드 검색</h1>
              </div>

              <div class="card search-box">
                <form id="explore-form" class="search-row">
                  <input type="search" id="explore-input" class="input" style="flex:1;min-width:200px;" placeholder="인물, 사건, 화재, 교통사고, 스토브리그 등 검색..." value="${esc(state.exploreQuery)}" />
                  <button type="submit" class="btn btn-primary">검색</button>
                  <button type="button" class="btn btn-blue-soft" id="btn-live-search" ${state.searchingLive ? 'disabled' : ''}>
                    ${state.searchingLive ? '실시간 검색 중...' : '실시간 RSS 검색'}
                  </button>
                </form>

                <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;">
                  <span style="color:var(--text-muted);font-weight:600;">추천 키워드:</span>
                  ${state.recentSearches
                    .map(
                      (term) => `
                    <button type="button" class="mini-btn" data-quick-search="${esc(term)}">#${esc(term)}</button>`
                    )
                    .join('')}
                </div>

                <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;padding-top:8px;border-top:1px solid var(--border);">
                  <div style="display:flex;flex-wrap:wrap;gap:6px;">
                    ${CATEGORY_TABS.map(
                      (t) => `
                      <button type="button" class="sort-btn ${state.exploreCategory === t.id ? 'active' : ''}" data-ex-cat="${t.id}">
                        ${t.label}
                      </button>`
                    ).join('')}
                  </div>
                  ${renderSortGroup()}
                </div>
              </div>

              <p class="sub-note font-mono-num">검색 결과 ${filtered.length}건</p>
              ${
                filtered.length
                  ? `<div class="cards-grid">${filtered.map((it) => renderIssueCard(it)).join('')}</div>`
                  : `<div class="empty-box"><p>조건에 맞는 이슈가 없습니다. ‘실시간 RSS 검색’ 버튼을 눌러 최신 기사를 찾아보세요.</p></div>`
              }
            </div>`;
        }

        function renderDetailPage(allIssues, issueId) {
          const issue = allIssues.find((i) => i.id === issueId);
          if (!issue) {
            return `<div class="empty-box"><p>요청한 이슈를 찾을 수 없습니다.</p><button type="button" class="btn btn-primary" data-nav="home" style="margin-top:12px;">홈으로</button></div>`;
          }

          const followed = state.followedIds.includes(issue.id);
          const bookmarked = state.bookmarkedIds.includes(issue.id);
          const thread = state.qaMessagesByIssue[issue.id] || [
            {
              role: 'bot',
              text: `‘${issue.title}’ 브리핑에 대해 궁금한 점(확인된 사실, 미확인 주장, 타임라인, 공식 입장 등)을 물어보세요.`,
            },
          ];

          return `
            <div class="stack-lg">
              <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--border);">
                <button type="button" class="btn btn-secondary" id="btn-back">← 목록으로</button>
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                  <button type="button" class="btn ${bookmarked ? 'btn-blue-soft' : 'btn-secondary'}" data-bookmark="${esc(issue.id)}">
                    ${bookmarked ? '저장됨' : '저장'}
                  </button>
                  <button type="button" class="btn ${followed ? 'btn-primary' : 'btn-secondary'}" data-follow="${esc(issue.id)}">
                    ${followed ? '팔로우 중' : '이슈 팔로우'}
                  </button>
                </div>
              </div>

              <header style="max-width:780px;">
                <div class="meta-line">
                  <span class="txt-violet">${esc(CATEGORY_LABELS[issue.category])}</span>
                  <span>·</span>
                  <span>${esc(issue.regionLabel)}</span>
                  <span>·</span>
                  <span class="txt-blue">${esc(STATUS_LABELS[issue.status])}</span>
                  <span>·</span>
                  <span class="font-mono-num">${esc(issue.updatedAt)}</span>
                  <span>·</span>
                  <span class="font-mono-num">조회 ${formatNum(issue.viewCount)}</span>
                  <span>·</span>
                  <span class="font-mono-num">팔로우 ${formatNum(issue.followCount)}</span>
                </div>
                <h1 class="h1-title" style="margin-top:10px;">${esc(issue.title)}</h1>
                <p style="margin:10px 0 0;color:var(--text-secondary);font-size:16px;">${esc(issue.subtitle)}</p>
              </header>

              <div class="detail-grid">
                <div class="stack-lg">
                  <figure class="detail-figure" style="margin:0;">
                    <img src="${esc(issue.coverImage)}" alt="${esc(issue.coverAlt || issue.title)}" />
                    <figcaption class="detail-caption">${esc(issue.coverAlt)}</figcaption>
                  </figure>

                  <section class="summary-box">
                    <p class="eyebrow" style="margin-bottom:10px;">30초 핵심 요약</p>
                    <ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14.5px;">
                      ${issue.summary30s.map((s) => `<li>${esc(s)}</li>`).join('')}
                    </ol>
                  </section>

                  <section class="card detail-box">
                    <h2 class="h2-title" style="font-size:17px;margin-bottom:8px;">배경 설명</h2>
                    <p style="margin:0;font-size:14px;color:var(--text-secondary);line-height:1.65;">${esc(issue.background.overview)}</p>
                    ${
                      issue.background.keyTerms && issue.background.keyTerms.length
                        ? `<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;">
                            ${issue.background.keyTerms
                              .map((kt) => `<div style="font-size:13px;"><strong>${esc(kt.term)}</strong> — <span style="color:var(--text-secondary);">${esc(kt.meaning)}</span></div>`)
                              .join('')}
                          </div>`
                        : ''
                    }
                  </section>

                  <section class="card detail-box">
                    <h2 class="h2-title" style="font-size:17px;margin-bottom:14px;">진행 타임라인</h2>
                    ${
                      issue.timeline.length
                        ? issue.timeline
                            .map(
                              (t) => `
                          <div class="timeline-item">
                            <span class="timeline-dot"></span>
                            <div class="meta-line" style="font-size:11.5px;">
                              <span class="font-mono-num txt-violet">${esc(t.dateLabel)}</span>
                              <span>·</span>
                              <span class="txt-blue">${esc(t.stage)}</span>
                            </div>
                            <div style="font-weight:700;font-size:14.5px;margin-top:3px;">${esc(t.title)}</div>
                            <p style="margin:4px 0 0;font-size:13px;color:var(--text-secondary);">${esc(t.description)}</p>
                          </div>`
                            )
                            .join('')
                        : '<p class="sub-note">등록된 타임라인이 없습니다.</p>'
                    }
                  </section>

                  <section class="fact-grid">
                    <div class="card detail-box">
                      <h2 class="h2-title" style="font-size:16px;color:var(--emerald);margin-bottom:10px;">확인된 사실</h2>
                      ${
                        issue.verifiedFacts.length
                          ? `<ul style="margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:8px;">

                <section class="card detail-box">

                  <p class="sub-note" style="margin-bottom:12px;">단일 HTML 파일 또는 수집된 이슈 브리핑 데이터를 저장합니다.</p>
                  <div style="display:flex;flex-wrap:wrap;gap:8px;">
                    <a href="/index.html?download=1" download="index.html" class="btn btn-primary" data-dl-html>index.html 다운로드</a>
                    <button type="button" class="btn btn-secondary" id="btn-copy-html">HTML 코드 복사</button>

                <div style="display:flex;flex-wrap:wrap;gap:8px;">
                  ${Object.keys(CATEGORY_LABELS)

                    })

            </div>`;
